<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성별 선택</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 스마트폰 화면 컨테이너 모사 */
        .container {
            width: 100%;
            max-width: 430px; /* 아이폰 Pro Max 규격 수준 */
            height: 100vh;
            max-height: 932px;
            background-color: #ffffff;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 상단 헤더 (뒤로가기 화살표 및 페이지 카운터) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            margin-bottom: 40px;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 0;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: #111111;
        }

        .page-indicator {
            font-size: 16px;
            font-weight: 500;
            color: #d1d1d6; /* 연한 회색 */
        }

        .page-indicator span {
            color: #8e8e93; /* 진한 회색 */
        }

        /* 텍스트 타이틀 영역 */
        .title-section {
            margin-bottom: 48px;
        }

        .main-title {
            font-size: 26px;
            font-weight: 700;
            color: #1c1c1e;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .sub-title {
            font-size: 16px;
            font-weight: 400;
            color: #aeaeaf;
            line-height: 1.5;
        }

        /* 성별 카드 선택 영역 */
        .gender-selection {
            display: flex;
            gap: 16px;
        }

        .gender-card {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid #f2f2f7;
            border-radius: 16px;
            padding: 32px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease-in-out;
        }

        /* 카드 마우스 호버 및 선택 시 시각 효과 */
        .gender-card:hover {
            transform: translateY(-2px);
        }

        /* 남성 카드 선택 상태 */
        .gender-card.male.active {
            border: 2px solid #6366f1;
            background-color: #f5f6ff;
        }

        /* 여성 카드 선택 상태 */
        .gender-card.female.active {
            border: 2px solid #ec4899;
            background-color: #fff5f9;
        }

        /* 성별 이모티콘/아이콘 스타일 */
        .gender-icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .gender-label {
            font-size: 16px;
            font-weight: 700;
            color: #2c2c2e;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <button class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24">
                    <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
                </svg>
            </button>
            <div class="page-indicator"><span>3</span>/10</div>
        </header>

        <section class="title-section">
            <h1 class="main-title">성별은<br>어떻게 되시나요?</h1>
            <p class="sub-title">성별에 따라 필요한 영양성분이<br>다를 수 있어요.</p>
        </section>

        <main class="gender-selection">
            <div class="gender-card male" onclick="selectGender(this, 'male')">
                <div class="gender-icon">🚹</div>
                <div class="gender-label">남성</div>
            </div>
            
            <div class="gender-card female" onclick="selectGender(this, 'female')">
                <div class="gender-icon">🚺</div>
                <div class="gender-label">여성</div>
            </div>
        </main>
    </div>

    <script>
        function selectGender(element, gender) {
            // 기존에 활성화된 모든 카드의 active 클래스 제거
            const cards = document.querySelectorAll('.gender-card');
            cards.forEach(card => card.classList.remove('active'));

            // 클릭한 카드에만 active 클래스 추가
            element.classList.add('active');

            // 필요 시 데이터 전송 처리 혹은 다음 페이지 이동 로직 연동부
            console.log("선택된 성별:", gender);
        }
    </script>
</body>
</html>
